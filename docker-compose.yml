services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      target: api
    command: node dist-server/server/db/migrate.js
    environment: &backend-environment
      NODE_ENV: development
      DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379
      DATA_MODE: postgres
      QUEUE_MODE: redis
      AUTH_MODE: disabled
      LLM_MODE: heuristic
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: api
    command: node dist-server/server/db/seed.js
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: api
    environment:
      <<: *backend-environment
      HOST: 0.0.0.0
      PORT: 8787
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '8787:8787'

  worker:
    build:
      context: .
      target: api
    command: node dist-server/server/worker.js
    environment: *backend-environment
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  postgres-data:
  redis-data:
